<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07151e">
<meta name="description" content="Pulse Road ultraligero: cuatro dificultades, música y menos carga para celulares antiguos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="lite.css">
<title>Pulse Road — Ultraligero</title>
</head>
<body>
<main id="lite-game" aria-label="Pulse Road ultraligero">
<canvas id="road" aria-hidden="true"></canvas>
<header><strong>pulse road</strong><span>ULTRALIGERO</span></header>
<section id="hud" hidden><div><span id="score">0</span><span id="combo">×1</span><button id="pause" aria-label="Pausar partida">Pausa</button></div><div id="energy" role="progressbar" aria-label="Energía" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span></span></div><div id="progress" role="progressbar" aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="80" aria-valuenow="0"><span></span></div></section>
<div id="feedback" aria-live="off"></div><div id="encouragement" role="status"></div>
<section id="panel"><h1>Pulse Road</h1><p id="boot-copy">Preparando el modo ultraligero…</p><a href="./">Volver al inicio</a><noscript>Activa JavaScript para jugar.</noscript></section>
<div id="controls" hidden><button data-lane="0" aria-label="Carril izquierdo">Izquierda</button><button data-lane="1" aria-label="Carril central">Centro</button><button data-lane="2" aria-label="Carril derecho">Derecha</button></div>
<footer><span id="song">Menos efectos. El mismo ritmo.</span><span id="fps" aria-live="off"></span></footer>
</main>
<script src="lite.js" defer></script>
</body></html>
